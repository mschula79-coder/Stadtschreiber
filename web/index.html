<!DOCTYPE html>
<html>
  <style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #C1DAE3;
  }

  #app-loading {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    box-sizing: border-box;
    padding: 32px;
    background-color: #C1DAE3;
    color: #333333;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  #app-loading-icon {
    width: 112px;
    height: 112px;
    object-fit: contain;
  }

  #app-loading-title {
    margin: 0;
    font-size: 28px;
    font-weight: 300;
  }

  #app-loading-message {
    margin: 0;
    font-size: 16px;
    opacity: 0.9;
  }

  #app-loading-spinner {
    width: 34px;
    height: 34px;
    box-sizing: border-box;
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: app-loading-spin 0.9s linear infinite;
  }

  @keyframes app-loading-spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #app-loading-spinner {
      animation-duration: 1.8s;
    }
  }
</style>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stadtschreiber Basel">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="stadtschreiber">
  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="icons/Icon-192.png"
  >
  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="favicon.png"
  >

  <meta
    name="theme-color"
    content="#145968"
  >

  <title>Stadtschreiber Basel - Entdecke dein zuhause</title>
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^5.0/dist/maplibre-gl.css">

  <script src="https://unpkg.com/maplibre-gl@^5.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@^4.0/dist/pmtiles.js"></script>

</head>
<body>
  <div
    id="app-loading"
    role="status"
    aria-live="polite"
    aria-label="Stadtschreiber Basel wird geladen"
  >
    <img
      id="app-loading-icon"
      src="icons/Icon-192.png"
      alt=""
    >

    <h1 id="app-loading-title">
      Stadtschreiber Basel
    </h1>

    <div id="app-loading-spinner"></div>

    <p id="app-loading-message">
      Die Anwendung wird geladen …
    </p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
